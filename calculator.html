<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link href="/index.css" rel="stylesheet" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link href="/index.css" rel="stylesheet" />
    <title>Miniräknare</title>
  </head>
  <body>
    <button class="btn btn-block mb-2">
      <a href="index.html"> Hem </a>
    </button>
    <h1>Miniräknare</h1>

    <div class="container mx-4">
      <h2 class="text-center mt-5">Calculator</h2>
      <div class="row justify-content-center mt-4">
        <div class="col-md-6">
          <input
            type="number"
            id="num1"
            class="formcontrol mb-2"
            placeholder="Enter a number"
          />
          <input
            type="number"
            id="num2"
            class="formcontrol mb-2"
            placeholder="Enter a number"
          />
          <button class="btn btn-primary btn-block mb-2" onclick="add()">
            Add
          </button>
          <button class="btn btn-secondary btn-block mb-2" onclick="subtract()">
            Subtract -
          </button>
          <button class="btn btn-success btn-block mb-2" onclick="multiply()">
            Multiply *
          </button>
          <button class="btn btn-danger btn-block mb-2" onclick="divide()">
            Divide /
          </button>
          <p>Result: <span id="result"> 0 </span></p>
        </div>
      </div>
    </div>

    <script src="calculator.js" />
  </body>
</html>
